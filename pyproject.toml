[project]
name = "poppy-agent"
version = "0.0.1"
description = "A small open source client for the Poppy (Personal Agent Protocol): discover what a business lets your agent do."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
poppy-agent = "poppy_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
